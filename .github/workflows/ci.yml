name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Minutes of the soak test (at most about 330: GitHub stops jobs after 6 hours; the full 8 hours run on a real PC)"
        default: "5"

# The suffix starts a fresh group: run #36 (2026-11-11) got stuck in GitHub's dispatch, cannot be cancelled,
# and kept every later run of the old group waiting behind it. Bump it again if that ever repeats.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-2
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Everything except the WinUI app. The Windows libraries cross-compile on Linux,
      # which catches most mistakes minutes before the Windows job reports.
      - name: Restore
        run: dotnet restore Weatherly.CrossPlatform.slnf

      - name: Check formatting
        run: dotnet format Weatherly.CrossPlatform.slnf --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Weatherly.CrossPlatform.slnf -c Release --no-restore

      - name: Test Weatherly.Core
        run: dotnet test --project tests/Weatherly.Core.Tests -c Release --no-build

  windows:
    name: Windows (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Weatherly.slnx -p:Platform=${{ matrix.platform }}

      - name: Build solution
        run: dotnet build Weatherly.slnx -c Release -p:Platform=${{ matrix.platform }} --no-restore

      # The runner is an x64 machine: tests and the app can only run in the x64 leg. ARM64 is build-only.
      - name: Check formatting
        if: matrix.platform == 'x64'
        run: dotnet format Weatherly.slnx --verify-no-changes --no-restore

      - name: Test Weatherly.Core
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Weatherly.Core.Tests -c Release --no-build

      # Each test that renders saves its frame as PNG into the preview folder.
      - name: Test Weatherly.Render (WARP)
        if: matrix.platform == 'x64'
        env:
          WEATHERLY_PREVIEW_DIR: ${{ runner.temp }}/previews/render
        run: dotnet test --project tests/Weatherly.Render.Tests -c Release --no-build

      # Preview frames of every scene in tools/Weatherly.FrameDump/Scenes, rendered headless with WARP.
      - name: Render FrameDump previews
        if: always() && matrix.platform == 'x64'
        run: dotnet run --project tools/Weatherly.FrameDump -c Release -p:Platform=x64 -- --out "${{ runner.temp }}/previews/framedump"

      # Runs even when a render test failed (for example a golden still waiting for review), so every
      # push gets the full picture.
      - name: Smoke test the app
        if: always() && matrix.platform == 'x64'
        shell: pwsh
        run: >-
          ./tools/ci/smoke-test.ps1 -Platform x64
          -ReportDirectory "$env:RUNNER_TEMP/smoke"
          -PreviewDirectory "$env:RUNNER_TEMP/previews/desktop"

      - name: Upload smoke test reports
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: smoke-reports
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore

      # Rendered frames and desktop screenshots, for review without a Windows desktop.
      - name: Upload previews
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: previews
          path: ${{ runner.temp }}/previews/
          if-no-files-found: ignore

  # Soak test (M13): the app runs with everything on while memory, handles and GDI/USER objects are sampled.
  # 5 minutes on every push catch fast leaks; longer runs via "Run workflow", the full 8 hours on a real PC.
  soak:
    name: Soak (x64)
    runs-on: windows-latest
    # Expressions have no arithmetic: a run started by hand may take up to GitHub's limit, a push run 40 minutes.
    timeout-minutes: ${{ inputs.soak_minutes && 360 || 40 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Soak test the app
        shell: pwsh
        run: >-
          ./tools/ci/soak-test.ps1 -Platform x64
          -Minutes ${{ inputs.soak_minutes || '5' }}
          -ReportDirectory "$env:RUNNER_TEMP/soak"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: soak
          path: ${{ runner.temp }}/soak/
          if-no-files-found: ignore

  # MSIX for x64 and ARM64 (M14). Pull requests prove the package builds. A version tag also drafts a release
  # and, when the store identity and Artifact Signing secrets are set, signs a copy for winget.
  package:
    name: Package (${{ matrix.platform }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build the MSIX
        shell: pwsh
        env:
          WEATHERLY_PACKAGE_NAME: ${{ vars.WEATHERLY_PACKAGE_NAME }}
          WEATHERLY_PACKAGE_PUBLISHER: ${{ vars.WEATHERLY_PACKAGE_PUBLISHER }}
          WEATHERLY_PUBLISHER_DISPLAY_NAME: ${{ vars.WEATHERLY_PUBLISHER_DISPLAY_NAME }}
        run: ./tools/ci/package.ps1 -Platform ${{ matrix.platform }} -OutputDirectory "$env:RUNNER_TEMP/packages"

      - name: Upload the MSIX
        uses: actions/upload-artifact@v6
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error

  release:
    name: Draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: msix-*
          merge-multiple: true
          path: packages

      - name: Prepare the trusted copies
        if: vars.WEATHERLY_PACKAGE_PUBLISHER != '' && secrets.AZURE_TENANT_ID != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trusted | Out-Null
          Get-ChildItem packages -Filter *.unsigned.msix | ForEach-Object {
            Copy-Item $_.FullName (Join-Path trusted ($_.Name -replace '\.unsigned\.msix$', '.msix'))
          }

      - name: Sign with Azure Artifact Signing
        if: vars.WEATHERLY_PACKAGE_PUBLISHER != '' && secrets.AZURE_TENANT_ID != ''
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\trusted
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Publish the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @(
            "Draft release of ${{ github.ref_name }}."
            ""
            "*.unsigned.msix is the store upload. Partner Center signs it. It only matches a reservation when the package identity variables were set for this tag."
            "*.msix next to a .cer is signed with this run's development certificate. Install the .cer into Trusted People before sideloading."
            "When Azure Artifact Signing ran, the trusted .msix replaces the development .msix. That file is the one winget should use."
          ) | Set-Content -Encoding utf8 notes.md
          if (Test-Path trusted) {
            $files = @(Get-ChildItem trusted -Filter *.msix) + @(Get-ChildItem packages -Recurse -File | Where-Object { $_.Name -like '*.unsigned.msix' -or $_.FullName -match '\\Dependencies\\' })
          }
          else {
            $files = @(Get-ChildItem packages -Recurse -File)
          }
          gh release create "${{ github.ref_name }}" @($files.FullName) --draft --title "${{ github.ref_name }}" --notes-file notes.md
