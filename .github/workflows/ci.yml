name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Minutes of the soak test (at most about 330: GitHub stops jobs after 6 hours; the full 8 hours run on a real PC)"
        default: "5"

# The suffix starts a fresh group: run #36 (2026-11-11) got stuck in GitHub's dispatch, cannot be cancelled,
# and kept every later run of the old group waiting behind it. Bump it again if that ever repeats.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-2
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Everything except the WinUI app. The Windows libraries cross-compile on Linux,
      # which catches most mistakes minutes before the Windows job reports.
      - name: Restore
        run: dotnet restore Sillfall.CrossPlatform.slnf

      - name: Check formatting
        run: dotnet format Sillfall.CrossPlatform.slnf --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Sillfall.CrossPlatform.slnf -c Release --no-restore

      - name: Test Sillfall.Core
        run: dotnet test --project tests/Sillfall.Core.Tests -c Release --no-build

  windows:
    name: Windows (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sillfall.slnx -p:Platform=${{ matrix.platform }}

      - name: Build solution
        run: dotnet build Sillfall.slnx -c Release -p:Platform=${{ matrix.platform }} --no-restore

      # The runner is an x64 machine: tests and the app can only run in the x64 leg. ARM64 is build-only.
      - name: Check formatting
        if: matrix.platform == 'x64'
        run: dotnet format Sillfall.slnx --verify-no-changes --no-restore

      - name: Test Sillfall.Core
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Sillfall.Core.Tests -c Release --no-build

      # Each test that renders saves its frame as PNG into the preview folder.
      - name: Test Sillfall.Render (WARP)
        if: matrix.platform == 'x64'
        env:
          SILLFALL_PREVIEW_DIR: ${{ runner.temp }}/previews/render
        run: dotnet test --project tests/Sillfall.Render.Tests -c Release --no-build

      # Preview frames of every scene in tools/Sillfall.FrameDump/Scenes, rendered headless with WARP.
      - name: Render FrameDump previews
        if: always() && matrix.platform == 'x64'
        run: dotnet run --project tools/Sillfall.FrameDump -c Release -p:Platform=x64 -- --out "${{ runner.temp }}/previews/framedump"

      # Runs even when a render test failed (for example a golden still waiting for review), so every
      # push gets the full picture.
      - name: Smoke test the app
        if: always() && matrix.platform == 'x64'
        shell: pwsh
        run: >-
          ./tools/ci/smoke-test.ps1 -Platform x64
          -ReportDirectory "$env:RUNNER_TEMP/smoke"
          -PreviewDirectory "$env:RUNNER_TEMP/previews/desktop"

      - name: Upload smoke test reports
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: smoke-reports
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore

      # Rendered frames and desktop screenshots, for review without a Windows desktop.
      - name: Upload previews
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: previews
          path: ${{ runner.temp }}/previews/
          if-no-files-found: ignore

  # Soak test (M13): the app runs with everything on while memory, handles and GDI/USER objects are sampled.
  # 5 minutes on every push catch fast leaks; longer runs via "Run workflow", the full 8 hours on a real PC.
  soak:
    name: Soak (x64)
    runs-on: windows-latest
    # Expressions have no arithmetic: a run started by hand may take up to GitHub's limit, a push run 40 minutes.
    timeout-minutes: ${{ inputs.soak_minutes && 360 || 40 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Soak test the app
        shell: pwsh
        run: >-
          ./tools/ci/soak-test.ps1 -Platform x64
          -Minutes ${{ inputs.soak_minutes || '5' }}
          -ReportDirectory "$env:RUNNER_TEMP/soak"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: soak
          path: ${{ runner.temp }}/soak/
          if-no-files-found: ignore

  # MSIX for x64 and ARM64 (M14). Pull requests prove the package builds. A version tag also publishes a release
  # and, when the store identity and Artifact Signing secrets are set, signs a copy for winget.
  package:
    name: Package (${{ matrix.platform }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build the MSIX
        shell: pwsh
        env:
          SILLFALL_PACKAGE_NAME: ${{ vars.SILLFALL_PACKAGE_NAME }}
          SILLFALL_PACKAGE_PUBLISHER: ${{ vars.SILLFALL_PACKAGE_PUBLISHER }}
          SILLFALL_PUBLISHER_DISPLAY_NAME: ${{ vars.SILLFALL_PUBLISHER_DISPLAY_NAME }}
        run: ./tools/ci/package.ps1 -Platform ${{ matrix.platform }} -OutputDirectory "$env:RUNNER_TEMP/packages"

      - name: Upload the MSIX
        uses: actions/upload-artifact@v6
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error

  # Setup .exe for x64 and ARM64 (ADR-0018): the unpackaged app, self-contained, wrapped with Inno Setup.
  installer:
    name: Installer (${{ matrix.platform }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build the setup
        shell: pwsh
        run: ./tools/ci/installer.ps1 -Platform ${{ matrix.platform }} -OutputDirectory "$env:RUNNER_TEMP/installer"

      - name: Upload the setup
        uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ runner.temp }}/installer/
          if-no-files-found: error

  # A version tag publishes the release: the setup .exe is the download for people, the MSIX files are for the
  # Store and for sideloading (ADR-0017, ADR-0018).
  release:
    name: Release
    needs: [package, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Steps cannot read secrets in `if:`; the job env can. "true" when the reserved identity and the signing secrets are set.
      PUBLIC_SIGNING: ${{ vars.SILLFALL_PACKAGE_PUBLISHER != '' && secrets.AZURE_TENANT_ID != '' }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: msix-*
          merge-multiple: true
          path: packages

      - name: Download setups
        uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          merge-multiple: true
          path: setups

      - name: Prepare the trusted copies
        if: env.PUBLIC_SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trusted | Out-Null
          Get-ChildItem packages -Filter *.unsigned.msix | ForEach-Object {
            Copy-Item $_.FullName (Join-Path trusted ($_.Name -replace '\.unsigned\.msix$', '.msix'))
          }

      - name: Sign with Azure Artifact Signing
        if: env.PUBLIC_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\trusted
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @(
            "## Install"
            ""
            "Download the **Sillfall-Setup-…-x64.exe** file (**…-arm64.exe** on an ARM PC) and run it. No administrator rights needed; it installs for the current user and adds a Start menu entry. Uninstall from Settings > Apps."
            ""
            "The setup is not code-signed yet, so Windows SmartScreen may warn about an unknown publisher. Choose *More info* > *Run anyway*. SHA256SUMS-setup-*.txt has the checksums."
            ""
            "Requires Windows 10 version 2004 (build 19041) or newer."
            ""
            "## Other files"
            ""
            "- *.unsigned.msix is the Microsoft Store upload. Partner Center signs it."
            "- *.msix next to a .cer is signed with a development certificate. Install the .cer into Trusted People before sideloading. When Azure Artifact Signing ran, the trusted .msix replaces it."
          ) | Set-Content -Encoding utf8 notes.md
          $setups = @(Get-ChildItem setups -File)
          if (Test-Path trusted) {
            $packages = @(Get-ChildItem trusted -Filter *.msix) + @(Get-ChildItem packages -Recurse -File | Where-Object { $_.Name -like '*.unsigned.msix' -or $_.FullName -match '\\Dependencies\\' })
          }
          else {
            $packages = @(Get-ChildItem packages -Recurse -File)
          }
          $files = $setups + $packages
          gh release create "${{ github.ref_name }}" @($files.FullName) --repo "${{ github.repository }}" --verify-tag --latest --title "Sillfall ${{ github.ref_name }}" --notes-file notes.md
