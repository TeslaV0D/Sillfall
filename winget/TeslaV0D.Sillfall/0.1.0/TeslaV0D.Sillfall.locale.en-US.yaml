ShortDescription: Animated weather on top of your open windows. Clicks pass through.
Description: |-
  Sillfall draws rain, snow, fog, falling leaves, sunlight and grass on top of your open windows.
  The weather lands on window edges and gets out of the way for a full-screen game, the lock screen and the Start menu.
  Clicks pass through. Weather sync is optional and sends only a location rounded to about 11 km.
