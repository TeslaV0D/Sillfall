ShortDescription: Animiertes Wetter über deinen offenen Fenstern. Klicks gehen hindurch.
Description: |-
  Weatherly zeichnet Regen, Schnee, Nebel, Laub, Sonnenlicht und Gras über die offenen Fenster.
  Das Wetter liegt auf den Kanten und macht Platz für ein Vollbildspiel, den Sperrbildschirm und das Startmenü.
  Klicks gehen hindurch. Der Wetter-Sync ist optional und sendet nur einen auf etwa 11 km gerundeten Standort.
